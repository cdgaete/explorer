<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Energy Network Explorer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-tertiary: #0f3460;
      --text-primary: #eee;
      --text-muted: #888;
      --accent: #e94560;
      --success: #00ff88;
      --border: #2a2a4a;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Header */
    .header {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      gap: 16px;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header-actions { display: flex; gap: 8px; margin-left: auto; }
    /* Buttons */
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      transition: background 0.2s;
    }
    button:hover { background: var(--accent); }
    button.primary { background: var(--accent); }
    button.primary:hover { background: #d63850; }
    
    /* Main Layout */
    .main-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    /* Network List */
    .network-item {
      padding: 12px;
      background: var(--bg-tertiary);
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .network-item:hover { background: var(--border); }
    .network-item.selected { border-left: 3px solid var(--accent); }
    .network-item h3 { font-size: 14px; margin-bottom: 4px; }
    .network-item .stats { font-size: 12px; color: var(--text-muted); }
    
    /* Content Area */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* Tabs */
    .tabs {
      display: flex;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 12px 20px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .tab:hover { color: var(--text-primary); }
    .tab.active {
      color: var(--text-primary);
      border-bottom-color: var(--accent);
    }
    /* Tab Content */
    .tab-content {
      flex: 1;
      overflow: auto;
      padding: 16px;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    
    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: var(--bg-secondary);
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    tr:hover { background: var(--bg-secondary); }
    
    /* Status */
    .status-bar {
      padding: 6px 16px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }
    .empty-state {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ Energy Network Explorer</h1>
    <div class="header-actions">
      <button onclick="loadExampleNetwork()">Load Example</button>
      <button onclick="openFileDialog()" class="primary">Open Network</button>
    </div>
  </div>
  
  <div class="main-container">
    <div class="sidebar">
      <div class="sidebar-header">Networks</div>
      <div class="sidebar-content" id="network-list">
        <div class="empty-state">No networks loaded</div>
      </div>
    </div>
    
    <div class="content">
      <div class="tabs">
        <div class="tab active" data-tab="buses">Buses</div>
        <div class="tab" data-tab="generators">Generators</div>
        <div class="tab" data-tab="lines">Lines</div>
        <div class="tab" data-tab="loads">Loads</div>
        <div class="tab" data-tab="links">Links</div>
      </div>
      
      <div class="tab-content">
        <div id="buses" class="tab-panel active"></div>
        <div id="generators" class="tab-panel"></div>
        <div id="lines" class="tab-panel"></div>
        <div id="loads" class="tab-panel"></div>
        <div id="links" class="tab-panel"></div>
      </div>
    </div>
  </div>
  
  <div class="status-bar">
    <div class="status-indicator">
      <div class="status-dot"></div>
      <span id="status-text">Connected to backend</span>
    </div>
    <span id="network-info">No network selected</span>
  </div>
  <script>
    let selectedNetwork = null;
    
    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });
    
    async function loadExampleNetwork() {
      try {
        const result = await window.backendAPI.post('/networks/example');
        await refreshNetworkList();
        selectNetwork(result.id);
      } catch (e) {
        console.error('Failed to load example:', e);
      }
    }
    
    async function openFileDialog() {
      const result = await window.electronAPI.openFileDialog();
      if (!result.canceled && result.filePaths.length > 0) {
        const filePath = result.filePaths[0];
        // For now, we'll use the example - file upload needs FormData
        alert('File picker selected: ' + filePath + '\nUsing example network for now.');
        await loadExampleNetwork();
      }
    }
    
    async function refreshNetworkList() {
      const data = await window.backendAPI.get('/networks');
      const list = document.getElementById('network-list');
      
      if (data.networks.length === 0) {
        list.innerHTML = '<div class="empty-state">No networks loaded</div>';
        return;
      }
      list.innerHTML = data.networks.map(n => `
        <div class="network-item ${selectedNetwork === n.id ? 'selected' : ''}" onclick="selectNetwork('${n.id}')">
          <h3>${n.name}</h3>
          <div class="stats">
            ${n.buses} buses · ${n.generators} generators · ${n.lines} lines
          </div>
        </div>
      `).join('');
    }
    
    async function selectNetwork(networkId) {
      selectedNetwork = networkId;
      await refreshNetworkList();
      document.getElementById('network-info').textContent = `Network: ${networkId}`;
      
      // Load all component data
      await Promise.all([
        loadBuses(networkId),
        loadGenerators(networkId),
        loadLines(networkId),
        loadLoads(networkId),
        loadLinks(networkId),
      ]);
    }
    
    function renderTable(data, columns) {
      if (!data || data.length === 0) {
        return '<div class="empty-state">No data</div>';
      }
      const headers = columns.map(c => `<th>${c}</th>`).join('');
      const rows = data.map(row => 
        `<tr>${columns.map(c => `<td>${row[c] ?? '-'}</td>`).join('')}</tr>`
      ).join('');
      return `<table><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table>`;
    }
    async function loadBuses(networkId) {
      const data = await window.backendAPI.get(`/networks/${networkId}/buses`);
      document.getElementById('buses').innerHTML = renderTable(
        data.buses, ['name', 'x', 'y', 'v_nom', 'carrier']
      );
    }
    
    async function loadGenerators(networkId) {
      const data = await window.backendAPI.get(`/networks/${networkId}/generators`);
      document.getElementById('generators').innerHTML = renderTable(
        data.generators, ['name', 'bus', 'carrier', 'p_nom', 'marginal_cost']
      );
    }
    
    async function loadLines(networkId) {
      const data = await window.backendAPI.get(`/networks/${networkId}/lines`);
      document.getElementById('lines').innerHTML = renderTable(
        data.lines, ['name', 'bus0', 'bus1', 's_nom', 'x', 'length']
      );
    }
    
    async function loadLoads(networkId) {
      const data = await window.backendAPI.get(`/networks/${networkId}/loads`);
      document.getElementById('loads').innerHTML = renderTable(
        data.loads, ['name', 'bus', 'carrier', 'p_set']
      );
    }
    
    async function loadLinks(networkId) {
      const data = await window.backendAPI.get(`/networks/${networkId}/links`);
      document.getElementById('links').innerHTML = renderTable(
        data.links, ['name', 'bus0', 'bus1', 'p_nom', 'carrier', 'efficiency']
      );
    }
    
    // Initial load
    refreshNetworkList();
  </script>
</body>
</html>
