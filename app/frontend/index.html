<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Energy Network Explorer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-tertiary: #0f3460;
      --text-primary: #eee;
      --text-muted: #888;
      --accent: #e94560;
      --success: #00ff88;
      --border: #2a2a4a;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Header */
    .header {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      gap: 16px;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header-actions { display: flex; gap: 8px; margin-left: auto; }
    /* Buttons */
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      transition: background 0.2s;
    }
    button:hover { background: var(--accent); }
    button.primary { background: var(--accent); }
    button.primary:hover { background: #d63850; }
    
    /* Main Layout */
    .main-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    /* Network List */
    .network-item {
      padding: 12px;
      background: var(--bg-tertiary);
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .network-item:hover { background: var(--border); }
    .network-item.selected { border-left: 3px solid var(--accent); }
    .network-item h3 { font-size: 14px; margin-bottom: 4px; }
    .network-item .stats { font-size: 12px; color: var(--text-muted); }
    
    /* Content Area */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* Tabs */
    .tabs {
      display: flex;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 12px 20px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .tab:hover { color: var(--text-primary); }
    .tab.active {
      color: var(--text-primary);
      border-bottom-color: var(--accent);
    }
    /* Tab Content */
    .tab-content {
      flex: 1;
      overflow: auto;
      padding: 16px;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    
    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: var(--bg-secondary);
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    tr:hover { background: var(--bg-secondary); }
    
    /* Status */
    .status-bar {
      padding: 6px 16px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }
    .empty-state {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
    }
    #map {
      height: 100%;
      width: 100%;
      background: var(--bg-tertiary);
    }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div class="header">
    <h1>⚡ Energy Network Explorer</h1>
    <div class="header-actions">
      <button onclick="loadExampleNetwork()">Load Example</button>
      <button onclick="openFileDialog()" class="primary">Open Network</button>
    </div>
  </div>
  
  <div class="main-container">
    <div class="sidebar">
      <div class="sidebar-header">Networks</div>
      <div class="sidebar-content" id="network-list">
        <div class="empty-state">No networks loaded</div>
      </div>
    </div>
    
    <div class="content">
      <div class="tabs">
        <div class="tab active" data-tab="map">Map</div>
        <div class="tab" data-tab="buses">Buses</div>
        <div class="tab" data-tab="generators">Generators</div>
        <div class="tab" data-tab="lines">Lines</div>
        <div class="tab" data-tab="loads">Loads</div>
        <div class="tab" data-tab="links">Links</div>
      </div>
      
      <div class="tab-content">
        <div id="map" class="tab-panel active" style="padding: 0;"></div>
        <div id="buses" class="tab-panel"></div>
        <div id="generators" class="tab-panel"></div>
        <div id="lines" class="tab-panel"></div>
        <div id="loads" class="tab-panel"></div>
        <div id="links" class="tab-panel"></div>
      </div>
    </div>
  </div>
  
  <div class="status-bar">
    <div class="status-indicator">
      <div class="status-dot"></div>
      <span id="status-text">Connected to backend</span>
    </div>
    <span id="network-info">No network selected</span>
  </div>
  <script>
    let selectedNetwork = null;
    let map = null;
    let mapLayers = { buses: null, lines: null, links: null };
    
    // Initialize map
    function initMap() {
      if (map) return;
      map = L.map('map').setView([50, 10], 4);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);
    }
    
    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
        // Resize map when switching to map tab
        if (tab.dataset.tab === 'map' && map) {
          setTimeout(() => map.invalidateSize(), 100);
        }
      });
    });
    
    async function loadExampleNetwork() {
      try {
        console.log('Loading example network...');
        const result = await window.backendAPI.post('/networks/example');
        console.log('Example loaded:', result);
        await refreshNetworkList();
        selectNetwork(result.id);
      } catch (e) {
        console.error('Failed to load example:', e);
        alert('Failed to load example network: ' + e.message);
      }
    }
    
    async function openFileDialog() {
      const result = await window.electronAPI.openFileDialog();
      if (!result.canceled && result.filePaths.length > 0) {
        const filePath = result.filePaths[0];
        // For now, we'll use the example - file upload needs FormData
        alert('File picker selected: ' + filePath + '\nUsing example network for now.');
        await loadExampleNetwork();
      }
    }
    
    async function refreshNetworkList() {
      try {
        console.log('Refreshing network list...');
        const data = await window.backendAPI.get('/networks');
        console.log('Networks:', data);
        const list = document.getElementById('network-list');
        
        if (data.networks.length === 0) {
          list.innerHTML = '<div class="empty-state">No networks loaded</div>';
          return;
        }
        list.innerHTML = data.networks.map(n => `
          <div class="network-item ${selectedNetwork === n.id ? 'selected' : ''}" onclick="selectNetwork('${n.id}')">
            <h3>${n.name}</h3>
            <div class="stats">
              ${n.buses} buses · ${n.generators} generators · ${n.lines} lines
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error('Failed to refresh network list:', e);
      }
    }
    
    async function selectNetwork(networkId) {
      selectedNetwork = networkId;
      await refreshNetworkList();
      document.getElementById('network-info').textContent = `Network: ${networkId}`;
      
      // Load all component data
      await Promise.all([
        loadMap(networkId),
        loadBuses(networkId),
        loadGenerators(networkId),
        loadLines(networkId),
        loadLoads(networkId),
        loadLinks(networkId),
      ]);
    }
    
    async function loadMap(networkId) {
      initMap();
      
      // Clear existing layers
      Object.values(mapLayers).forEach(layer => {
        if (layer) map.removeLayer(layer);
      });
      
      try {
        const [busData, lineData, linkData] = await Promise.all([
          window.backendAPI.get(`/networks/${networkId}/buses`),
          window.backendAPI.get(`/networks/${networkId}/lines`),
          window.backendAPI.get(`/networks/${networkId}/links`),
        ]);
        
        const buses = busData.buses;
        const busMap = {};
        buses.forEach(b => { busMap[b.name] = b; });
        
        // Draw lines
        const lineCoords = lineData.lines
          .filter(l => busMap[l.bus0] && busMap[l.bus1])
          .map(l => [[busMap[l.bus0].y, busMap[l.bus0].x], [busMap[l.bus1].y, busMap[l.bus1].x]]);
        if (lineCoords.length > 0) {
          mapLayers.lines = L.polyline(lineCoords, { color: '#4a9eff', weight: 2 }).addTo(map);
        }
        
        // Draw links (DC lines)
        const linkCoords = linkData.links
          .filter(l => busMap[l.bus0] && busMap[l.bus1])
          .map(l => [[busMap[l.bus0].y, busMap[l.bus0].x], [busMap[l.bus1].y, busMap[l.bus1].x]]);
        if (linkCoords.length > 0) {
          mapLayers.links = L.polyline(linkCoords, { color: '#e94560', weight: 2, dashArray: '5,5' }).addTo(map);
        }
        
        // Draw buses
        const busMarkers = buses
          .filter(b => b.x !== 0 || b.y !== 0)
          .map(b => L.circleMarker([b.y, b.x], {
            radius: 8,
            fillColor: b.carrier === 'DC' ? '#e94560' : '#4a9eff',
            color: '#fff',
            weight: 2,
            fillOpacity: 0.8
          }).bindPopup(`<b>${b.name}</b><br>Carrier: ${b.carrier}<br>V: ${b.v_nom} kV`));
        
        if (busMarkers.length > 0) {
          mapLayers.buses = L.layerGroup(busMarkers).addTo(map);
          // Fit map to bounds with more padding
          const bounds = L.latLngBounds(buses.filter(b => b.x || b.y).map(b => [b.y, b.x]));
          map.fitBounds(bounds, { padding: [50, 50], maxZoom: 6 });
        }
      } catch (e) {
        console.error('Failed to load map:', e);
      }
    }
    
    function renderTable(data, columns) {
      if (!data || data.length === 0) {
        return '<div class="empty-state">No data</div>';
      }
      const headers = columns.map(c => `<th>${c}</th>`).join('');
      const rows = data.map(row => 
        `<tr>${columns.map(c => `<td>${row[c] ?? '-'}</td>`).join('')}</tr>`
      ).join('');
      return `<table><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table>`;
    }
    async function loadBuses(networkId) {
      const data = await window.backendAPI.get(`/networks/${networkId}/buses`);
      document.getElementById('buses').innerHTML = renderTable(
        data.buses, ['name', 'x', 'y', 'v_nom', 'carrier']
      );
    }
    
    async function loadGenerators(networkId) {
      const data = await window.backendAPI.get(`/networks/${networkId}/generators`);
      document.getElementById('generators').innerHTML = renderTable(
        data.generators, ['name', 'bus', 'carrier', 'p_nom', 'marginal_cost']
      );
    }
    
    async function loadLines(networkId) {
      const data = await window.backendAPI.get(`/networks/${networkId}/lines`);
      document.getElementById('lines').innerHTML = renderTable(
        data.lines, ['name', 'bus0', 'bus1', 's_nom', 'x', 'length']
      );
    }
    
    async function loadLoads(networkId) {
      const data = await window.backendAPI.get(`/networks/${networkId}/loads`);
      document.getElementById('loads').innerHTML = renderTable(
        data.loads, ['name', 'bus', 'carrier', 'p_set']
      );
    }
    
    async function loadLinks(networkId) {
      const data = await window.backendAPI.get(`/networks/${networkId}/links`);
      document.getElementById('links').innerHTML = renderTable(
        data.links, ['name', 'bus0', 'bus1', 'p_nom', 'carrier', 'efficiency']
      );
    }
    
    // Expose functions globally for onclick handlers
    window.loadExampleNetwork = loadExampleNetwork;
    window.openFileDialog = openFileDialog;
    window.selectNetwork = selectNetwork;
    
    // Initial load
    refreshNetworkList();
  </script>
</body>
</html>
